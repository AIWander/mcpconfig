# mcpconfig models.toml — AMD Hackathon Droplet
# Port map: 8001=120B, 8002=20B, 8003=mcpconfig (this server)

# MCP servers the driver can spawn
[[mcp_servers]]
name = "workflow"
command = "/root/workflow/target/release/workflow"
args = []

[[mcp_servers]]
name = "hands"
command = "/root/hands/target/release/hands"
args = []

# Models
[[models]]
name = "gpt-oss-120b"
base_url = "http://127.0.0.1:8001/v1"
model_id = "openai/gpt-oss-120b"
api_key_env = "VLLM_API_KEY"
strip_thinking_tags = true
max_tokens = 4096
temperature = 0.7
mcp_servers = ["hands", "workflow"]
tool_call_parser = "openai"
reasoning_parser = "openai_gptoss"
auto_tool_choice = true

[[models]]
name = "gpt-oss-20b"
base_url = "http://127.0.0.1:8002/v1"
model_id = "openai/gpt-oss-20b"
api_key_env = "VLLM_API_KEY"
strip_thinking_tags = true
max_tokens = 4096
temperature = 0.7
mcp_servers = ["hands", "workflow"]
tool_call_parser = "openai"
reasoning_parser = "openai_gptoss"
auto_tool_choice = true
